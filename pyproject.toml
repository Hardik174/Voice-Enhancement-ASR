[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-enhancement"
version = "0.1.0"
requires-python = ">=3.9,<3.13"
dependencies = [
  "torch>=2.1,<3",
  "torchaudio>=2.1,<3",
  "numpy>=1.24,<3",
  "soundfile>=0.12",
  "sounddevice>=0.4",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "transformers>=4.44",
  "huggingface_hub>=0.24",
]

[project.scripts]
voice-enhance = "src.infer.batch_infer:main"
voice-live = "src.infer.stream_infer:main"
voice-build-dataset = "src.augment.build_dataset:main"
voice-transcribe = "src.asr.transcribe:main"
voice-pipeline = "src.asr.pipeline:main"

[tool.setuptools.packages.find]
include = ["src*"]
